name: Build CLIProxyAPI Plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: |
          go vet ./src
          go test ./src -v

      - name: Build plugin (.so)
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -buildvcs=false -trimpath -buildmode=c-shared \
            -ldflags "-s -w -X main.pluginVersion=${GITHUB_REF_NAME#v}" \
            -o dist/any2api-bridge.so ./src
          rm -f dist/*.h

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go run -buildvcs=false ./.github/scripts/package-release.go \
            -library dist/any2api-bridge.so -entry any2api-bridge.so \
            -archive "dist/any2api-bridge_${VERSION}_linux_amd64.zip" \
            -checksum "dist/any2api-bridge_${VERSION}_linux_amd64.zip.sha256"
          cp "dist/any2api-bridge_${VERSION}_linux_amd64.zip.sha256" dist/checksums.txt

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/any2api-bridge_*_linux_amd64.zip
            dist/any2api-bridge_*_linux_amd64.zip.sha256
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
